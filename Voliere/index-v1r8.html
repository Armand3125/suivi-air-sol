 if(!/^[A-Z]{4}$/.test(icao))return '';
 const now=new Date(),today=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate());
 const date=new Date(VAC_ANCHOR+Math.floor((today-VAC_ANCHOR)/VAC_CYCLE)*VAC_CYCLE);
 const folder='eAIP_'+String(date.getUTCDate()).padStart(2,'0')+'_'+VAC_MONTHS[date.getUTCMonth()]+'_'+date.getUTCFullYear();
 return 'https://www.sia.aviation-civile.gouv.fr/media/dvd/'+folder+'/Atlas-VAC/PDF_AIPparSSection/VAC/AD/AD-2.'+encodeURIComponent(icao)+'.pdf';
}
function frequenciesByCategory(p){
 const unique=new Map();
 const details=Array.isArray(p.frequency_details)?p.frequency_details:[];
 if(details.length){
  for(const row of details){
   if(!row)continue;
   const value=String(row.frequency||row.transmission||row.reception||'').replace(/\s*MHZ\s*$/i,'').trim();
   if(!value)continue;
   const key=value.toUpperCase();
   if(!unique.has(key))unique.set(key,{value,types:new Set()});
   unique.get(key).types.add(String(row.display_type||row.service_type||row.frequency_type_label||row.service_label||'AUTRES').trim().toUpperCase()||'AUTRES');
  }
 }else if(p.frequency){
  for(const part of String(p.frequency).split(/\s*[|;,]\s*/)){
   const value=part.replace(/\s*MHZ\s*$/i,'').trim();
   if(value&&!unique.has(value.toUpperCase()))unique.set(value.toUpperCase(),{value,types:new Set(['FRÉQUENCES'])});
  }
 }
 if(!unique.size)return '';
 const cats=new Map();
 for(const entry of unique.values()){
  const name=[...entry.types].sort().join(' / ')||'AUTRES';
  if(!cats.has(name))cats.set(name,[]);
  cats.get(name).push(entry.value);
 }
 return '<div class="section"><div class="label">Fréquences par service <small>MHz</small></div>'+
 [...cats.entries()].sort((a,b)=>a[0].localeCompare(b[0],'fr')).map(([name,values])=>'<div class="freqcat"><strong>'+esc(name)+'</strong><div class="freqnums">'+values.map(v=>'<span class="freqnum">'+esc(v)+'</span>').join('')+'</div></div>').join('')+'</div>';
}
function detail(f){
 const p=f.properties;
 let out='<div class="hero"><span class="block" style="--c:'+color(f)+'">'+esc(String(p.type||p.code||'SIA').slice(0,7))+'</span><div><h3>'+esc(label(f))+'</h3><p>'+esc(cfg[p.layer][0])+'</p></div></div>';
 if(p.layer==='airspaces')out+='<div class="levels"><div class="level"><small>Plancher</small><b>'+esc(p.lower||'—')+'</b></div><div class="level"><small>Plafond</small><b>'+esc(p.upper||'—')+'</b></div></div>';
 const basic=Object.entries(labels).filter(v=>!['frequency','frequency_details'].includes(v[0])&&p[v[0]]!=null&&p[v[0]]!==''&&typeof p[v[0]]!=='object'&&!(p.layer==='airspaces'&&['lower','upper'].includes(v[0])));
 if(basic.length)out+='<dl class="kv">'+basic.map(v=>'<dt>'+esc(v[1])+'</dt><dd>'+esc(String(p[v[0]]))+'</dd>').join('')+'</dl>';
 out+=frequenciesByCategory(p);
 let buttons='<button class="btn" id="goto">◎ Afficher sur la carte</button>';
 if(p.layer==='aerodromes'){
  const pdf=vacUrl(p.code);
  if(pdf)buttons+='<a class="btn vac" href="'+esc(pdf)+'" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir la fiche VAC SIA '+esc(p.code)+'">↓ Fiche VAC · '+esc(String(p.code).toUpperCase())+' (PDF)</a>';
 }
 out+='<div class="section"><div class="buttons">'+buttons+'</div></div><div class="warning">SIA 01/10/2026 — consultation informative uniquement. Vérifier les publications officielles et NOTAM. Fiches VAC : SIA.</div>';
 show('detail','Fiche SIA',cfg[p.layer][0],out);
 $('goto').onclick=()=>{go(f);hide()};
}

map.on('click',e=>{if(!loaded){notice('Chargement SIA en cours');return}const p=e.latlng,list=cfg.airspaces[2]?at(p):[],c=p.lat.toFixed(6)+', '+p.lng.toFixed(6);show('point','Secteurs à ce point',c,'<div class="section"><div class="label">'+list.length+' espace(s) aérien(s)</div><div class="results">'+(list.length?list.slice(0,65).map(row).join(''):'<p class="mutedtext">Aucun secteur actif dans les filtres.</p>')+'</div></div><div class="section"><button class="btn muted" id="copy">⧉ Copier '+c+'</button></div>');$('copy').onclick=()=>navigator.clipboard.writeText(c).then(()=>notice('Coordonnées copiées')).catch(()=>notice('Copie impossible'));bind()});
function layers(){show('layers','Couches SIA','Objets affichés sur la carte','<div class="section"><div class="label">Activer les couches</div><div class="layers">'+Object.entries(cfg).map(v=>'<button type="button" class="layer '+(v[1][2]?'on':'')+'" data-layer="'+v[0]+'"><span class="dot" style="--c:'+v[1][1]+'"></span><span><b>'+v[1][0]+'</b><small>'+groups[v[0]].length+' objets</small></span><em>'+(v[1][2]?'✓':'+')+'</em></button>').join('')+'</div></div><div class="section"><div class="label">Types de secteurs</div><div class="chips">'+['ALL','CTR','TMA','R','D','P','Autres'].map(k=>'<button type="button" class="chip '+(type===k?'on':'')+'" data-type="'+k+'">'+(k==='ALL'?'Tous':k)+'</button>').join('')+'</div></div>');
document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{cfg[b.dataset.layer][2]=!cfg[b.dataset.layer][2];$('sectors').classList.toggle('on',cfg.airspaces[2]);$('sectors').setAttribute('aria-pressed',cfg.airspaces[2]);redraw();layers()});document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;redraw();layers()})}
function bases(){show('base','Fond de carte','Choisissez un fond fiable','<div class="results">'+Object.entries(backgrounds).map(([k,v])=>'<button class="item" type="button" data-base="'+k+'"><span class="stripe" style="--c:'+(bgName===k?'#12bdac':'#cbdede')+'"></span><span><b>'+v[0]+(bgName===k?' ✓':'')+'</b><small>Une seconde source prend le relais en cas d’échec</small></span><span class="arrow">›</span></button>').join('')+'</div><div class="section"><button class="btn muted" id="refresh">↻ Recharger les tuiles</button></div>');
document.querySelectorAll('[data-base]').forEach(b=>b.onclick=()=>{setBase(b.dataset.base);hide()});$('refresh').onclick=()=>{setBase(bgName);hide()}}
$('layers').onclick=layers;$('bases').onclick=bases;
$('sectors').onclick=()=>{cfg.airspaces[2]=!cfg.airspaces[2];$('sectors').classList.toggle('on',cfg.airspaces[2]);$('sectors').setAttribute('aria-pressed',cfg.airspaces[2]);redraw();notice(cfg.airspaces[2]?'Secteurs affichés':'Secteurs masqués')};
$('gps').onclick=()=>{if(!navigator.geolocation){notice('GPS indisponible');return}notice('Localisation…');navigator.geolocation.getCurrentPosition(p=>{pos.clearLayers();const c=[p.coords.latitude,p.coords.longitude];pos.addLayer(L.circle(c,{radius:p.coords.accuracy||30,color:'#1294c5',fillOpacity:.1,interactive:false}));pos.addLayer(L.marker(c,{icon:L.divIcon({className:'apin',html:'<div class="gpspin"></div>',iconSize:[22,22],iconAnchor:[11,11]})}));map.setView(c,12);notice('Position affichée')},e=>notice(e.code===1?'Autorisation GPS refusée':'Position indisponible'),{enableHighAccuracy:true,timeout:12000})};
function results(){const q=norm($('q').value);$('clear').style.display=q?'block':'none';if(!loaded){show('search','Recherche SIA','','<p class="mutedtext">Chargement des données…</p>');return}const toks=q.split(' ').filter(Boolean);let found=[];if(q)for(let i=0;i<features.length;i++){const f=features[i];if(category!=='all'&&f.properties.layer!==category)continue;if(toks.every(t=>finder[i].includes(t)))found.push(f)}
found.sort((a,b)=>{function score(f){const v=norm(f.properties.code),n=norm(f.properties.name);return v===q?0:v.startsWith(q)?1:n===q?2:n.startsWith(q)?3:4}return score(a)-score(b)});
show('search','Recherche SIA',q?found.length+' résultat(s)':'Nom, code, fréquence','<div class="chips" style="margin-bottom:14px">'+[['all','Tout'],['airspaces','Secteurs'],['aerodromes','Aérodromes'],['radionav','RadioNav'],['navfix','NavFix']].map(v=>'<button type="button" class="chip '+(category===v[0]?'on':'')+'" data-cat="'+v[0]+'">'+v[1]+'</button>').join('')+'</div><div class="results">'+(q?(found.slice(0,55).map(row).join('')||'<p class="mutedtext">Aucun résultat.</p>'):'<p class="mutedtext">Exemples : LFBO, NICE, LFR162, 125.030.</p>')+'</div>');
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;results()});bind()}
let qt=0;$('q').addEventListener('focus',results);$('q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(results,90)});$('clear').onclick=()=>{$('q').value='';results();$('q').focus()};
function accept(data){features=data.filter(f=>f&&f.geometry&&f.properties&&cfg[f.properties.layer]);finder=[];lookup.clear();Object.keys(cfg).forEach(k=>groups[k]=[]);
for(const f of features){f._b=Array.isArray(f.properties.bbox)?f.properties.bbox:bb(f.geometry);groups[f.properties.layer].push(f);lookup.set(id(f),f);const p=f.properties;finder.push(norm([p.name,p.label,p.code,p.type,p.frequency,p.service,p.remarks,p.station,p.manager,p.frequency_details&&JSON.stringify(p.frequency_details)].filter(Boolean).join(' ')))}loaded=true;status(features.length.toLocaleString('fr-FR')+' objets · 01/10/2026');$('status').classList.add('ok');redraw();if(mode==='search')results();if(mode==='layers')layers()}
async function load(){try{const r=await fetch('./sia-manifest.json',{cache:'no-store'});if(!r.ok)throw Error('manifest inaccessible');const m=await r.json();let fs=[];for(let i=0;i<m.chunks.length;i+=4){const a=await Promise.all(m.chunks.slice(i,i+4).map(async n=>{const r=await fetch('./'+n);if(!r.ok)throw Error(n);return(await r.json()).features}));fs.push(...a.flat());status('SIA '+Math.min(i+4,m.chunks.length)+'/'+m.chunks.length)}accept(fs)}catch(e){status('Données indisponibles');$('hint').textContent='Données SIA indisponibles';notice('Erreur de chargement SIA');console.error(e)}}
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(v=>v.filter(r=>new URL(r.scope).pathname.startsWith('/suivi-air-sol/Voliere/')).forEach(r=>r.unregister())).catch(()=>{});
if('caches' in window)caches.keys().then(v=>v.filter(k=>k.startsWith('voliere-')).forEach(k=>caches.delete(k))).catch(()=>{});
window.addEventListener('resize',()=>map.invalidateSize({animate:false}),{passive:true});window.addEventListener('orientationchange',()=>setTimeout(()=>map.invalidateSize({animate:false}),250));
load();
})();
</script></body></html>
