<style>
:root{--ink:#102d3a;--dark:#082d3a;--sea:#14c6b4;--border:#dceaea;--muted:#718b94;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
#map{position:fixed;inset:0;background:#d8e5ea}.leaflet-control-attribution{font-size:9px!important}.leaflet-top.leaflet-left{top:138px;left:8px}.leaflet-control-zoom{border:0!important;box-shadow:0 3px 15px #092b3a44!important}.leaflet-control-zoom a{width:38px!important;height:39px!important;line-height:39px!important;color:#0c6b75!important}
.header{position:absolute;z-index:500;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:620px;margin:auto;pointer-events:none}
.brand{height:49px;display:flex;align-items:center;gap:10px;padding:6px 10px;background:linear-gradient(115deg,#082d3afa,#0a5260f2);border:1px solid #7dd8d25c;border-radius:16px;color:white;box-shadow:0 8px 25px #092d3a48}

.logo svg{height:26px;width:26px}.brandtitle{min-width:0;flex:1}.brandtitle strong{display:block;letter-spacing:.09em;font-weight:930;font-size:16px;line-height:1.1}.brandtitle small{display:block;margin-top:4px;font-size:9px;letter-spacing:.12em;color:#9ce6e4;font-weight:850}

.searchbar{display:flex;align-items:center;gap:11px;margin-top:9px;height:53px;padding:0 10px 0 16px;background:#fbffff;border:1px solid white;border-radius:16px;box-shadow:0 6px 22px #132e3b4a;pointer-events:auto}
.searchbar svg{width:19px;height:19px;stroke:#15858c;flex:none}.searchbar input{border:0;outline:0;background:transparent;min-width:0;flex:1;height:48px;color:#1c404d;font-size:14px}.searchbar input::placeholder{color:#8fa4aa}

.dock{position:absolute;z-index:501;left:50%;bottom:calc(11px + var(--safe));transform:translateX(-50%);width:min(468px,calc(100% - 20px));background:#072e3bef;border:1px solid #59c4c078;border-radius:21px;padding:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;box-shadow:0 9px 28px #0b324c61;backdrop-filter:blur(16px)}
.nav{min-height:59px;border:0;background:transparent;border-radius:15px;color:#abdae0;display:grid;align-content:center;justify-items:center;gap:3px;font-size:10px;font-weight:780}.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav.on{background:linear-gradient(135deg,#39dfc8,#0caab3);color:#073542}
.hint{position:absolute;z-index:450;left:50%;bottom:calc(86px + var(--safe));transform:translateX(-50%);background:#0b3b4bea;border:1px solid #78d7d37a;color:#eaffff;font-size:11px;padding:8px 12px;border-radius:99px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.toast{display:none;position:absolute;z-index:999;top:calc(135px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#093b4a;color:white;border-radius:11px;padding:11px 14px;font-size:12px;box-shadow:0 6px 18px #102e4444;max-width:90%;text-align:center}
.shade{display:none;position:fixed;inset:0;background:#092c3d80;z-index:600}.sheet{position:fixed;z-index:650;bottom:0;left:0;right:0;max-width:650px;margin:auto;background:#fcffff;border-radius:23px 23px 0 0;box-shadow:0 -8px 33px #113a4e55;max-height:min(80dvh,800px);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .2s ease}.sheet.open{transform:translateY(0)}.grab{height:5px;width:39px;border-radius:99px;background:#c0d8da;margin:9px auto 5px;flex:none}
.head{padding:9px 15px 12px;display:flex;align-items:center;gap:12px;justify-content:space-between;border-bottom:1px solid var(--border)}.head h2{font-size:19px;margin:0}.head p{margin:3px 0 0;font-size:11px;color:var(--muted)}.close{width:37px;height:37px;flex:none;border:0;border-radius:10px;background:#e6f4f4;font-size:23px;color:#265763}
.body{padding:15px 16px calc(24px + var(--safe));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.section+.section{margin-top:19px;padding-top:17px;border-top:1px solid var(--border)}.label{font-size:10px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#3a858b;margin:0 0 9px}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.layer{display:flex;align-items:center;text-align:left;gap:9px;border:1px solid #dce9e9;padding:10px;border-radius:13px;min-height:58px;background:white;color:#486d76}.layer.on{background:#e5f8f4;border-color:#77d6c9;color:#164f57}.dot{width:13px;height:13px;background:var(--c);border-radius:4px;flex:none}.layer b{font-size:12px;display:block}.layer small{font-size:10px;display:block;color:var(--muted)}.layer em{margin-left:auto;font-style:normal;color:#0bb49d}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #d6e8e7;border-radius:99px;padding:8px 11px;background:#f3f9f8;color:#51717a;font-size:12px;font-weight:800}.chip.on{background:#087e88;color:white;border-color:#087e88}
.results{display:grid;gap:7px}.item{display:grid;grid-template-columns:5px 1fr auto;align-items:center;gap:12px;width:100%;min-height:62px;border:1px solid #dce9e8;border-radius:12px;background:white;text-align:left;padding:9px;color:#234450}.stripe{height:38px;border-radius:4px;background:var(--c)}.item b{display:block;font-size:13px}.item small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.item .arrow{font-size:22px;color:#9eb2b7}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:9px 12px;border-radius:10px;border:1px solid #a8dad5;background:#e9f8f5;color:#105c68;font-size:12px;font-weight:790}.btn.muted{background:white;border-color:#d9e8e7;color:#486c77}.mutedtext{font-size:12px;color:var(--muted);line-height:1.55}.buttons{display:flex;gap:8px;flex-wrap:wrap}
.hero{display:flex;gap:11px;align-items:center;margin-bottom:14px}.hero .block{width:46px;height:46px;border-radius:12px;background:var(--c);color:white;font-size:10px;font-weight:900;display:grid;place-items:center;flex:none}.hero h3{font-size:17px;margin:0}.hero p{margin:3px 0 0;font-size:11px;color:var(--muted)}.levels{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}.level{padding:10px;border-radius:10px;background:#eaf8f5}.level small{display:block;color:#709099;text-transform:uppercase;letter-spacing:.08em;font-size:9px}.level b{display:block;font-size:17px;color:#075d67;margin-top:4px}
.kv{display:grid;grid-template-columns:minmax(90px,34%) 1fr;margin:9px 0}.kv dt,.kv dd{padding:9px 0;border-top:1px solid var(--border);font-size:12px;margin:0;overflow-wrap:anywhere}.kv dt{color:var(--muted);padding-right:8px}.kv dd{font-weight:660;white-space:pre-line}.freq{border:1px solid #d4ede9;background:#ebf9f6;padding:9px;border-radius:10px;margin:7px 0}.freq b{font-size:14px;color:#0b6b76}.freq small{display:block;color:#60818d;margin-top:3px}
.warning{background:#fff8e9;border:1px solid #eddfc1;color:#816e40;border-radius:11px;padding:10px;margin-top:13px;font-size:11px;line-height:1.5}.point{width:16px;height:16px;border-radius:4px;transform:rotate(45deg);background:var(--c);border:2px solid var(--point-border,white);box-shadow:0 0 0 1px #164850,0 3px 9px #133b495c}.leaflet-marker-icon.apin{background:transparent;border:none!important}
@media(max-height:670px){.brand{height:43px}.leaflet-top.leaflet-left{top:124px}}@media(min-width:700px){.sheet{bottom:14px;border-radius:24px;max-height:75dvh}}@media(prefers-reduced-motion:reduce){.sheet{transition:none}}

.freqcat{margin:9px 0;padding:11px;border:1px solid #d9e9e7;border-radius:12px;background:#f0f9f8}
.freqcat strong{display:block;margin-bottom:7px;font-size:11px;letter-spacing:.07em;color:#0d6572}
.freqnums{display:flex;flex-wrap:wrap;gap:7px}
.freqnum{display:inline-flex;align-items:center;padding:7px 10px;background:#fff;border:1px solid #c7e4e0;border-radius:9px;font-weight:850;font-size:14px;font-variant-numeric:tabular-nums;color:#14434f}
.label small{font-size:10px;color:#66808a;font-weight:650;text-transform:none}
.buttons .vac{text-decoration:none;background:#0c8587;color:white;border-color:#0c8587;min-height:42px}
.buttons .vac:hover{background:#086a76}

/* V2R8 — panneaux de recherche adaptés au clavier natif */
body.search-active .header{z-index:850}
.sheet.searchsheet .body{min-height:0}
.sheet.searchsheet .searchchips{position:sticky;top:-15px;z-index:3;background:#fcffff;padding:8px 0 11px;margin-bottom:10px!important;border-bottom:1px solid #dceaea}
@media(max-width:699px){
 .sheet.searchsheet{
  top:var(--search-panel-top,135px);bottom:auto;left:8px;right:8px;max-width:none;
  height:var(--search-panel-height,calc(100dvh - 145px));max-height:none;
  border-radius:17px;transform:none;transition:none;margin:0;
 }
 .sheet.searchsheet:not(.open){visibility:hidden;pointer-events:none}
 .sheet.searchsheet .grab{display:none}
 .sheet.searchsheet .head{padding:7px 11px}
 .sheet.searchsheet .head h2{font-size:15px}
 .sheet.searchsheet .head p{display:none}
 .sheet.searchsheet .body{flex:1;overflow-y:auto;padding:8px 9px 12px}
 .sheet.searchsheet .searchchips{
  top:-8px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;
  padding:8px 0 10px;margin:0 0 9px!important
 }
 .sheet.searchsheet .searchchips .chip{
  min-width:0;padding:8px 2px;border-radius:9px;
  font-size:clamp(9px,2.55vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis
 }
}

/* Volière V2R8 : Secteurs multi-sélection, Couches, Fond ; tracés inspirés de Sofia VAC. */
.freqresults{display:grid;gap:8px}
.freqresult{border:1px solid #d9e8e8;border-left:4px solid var(--c,#0c8791);border-radius:12px;padding:10px 12px;background:#fff}
.freqresult-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.freqresult-head b{font-weight:900;font-size:16px;color:#0a4c5b;font-variant-numeric:tabular-nums}
.freqresult-head b small{font-size:10px;color:#66808a}
.freqservice{padding:5px 9px;background:#e9f8f6;color:#0c6976;border-radius:8px;font-weight:850;font-size:11px}
.freqowner{margin-top:5px;font-size:12px;font-weight:700;color:#244754}
.frequnit{margin-top:3px;font-size:11px;color:#657f8a}
.searchguide{margin:0 0 10px}

.sector-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sector-choice{min-height:61px;display:flex;align-items:center;gap:8px;min-width:0;background:white;border:1px solid #d8e6ea;border-radius:13px;padding:8px 9px;color:#214c61;text-align:left}
.sector-choice.on{background:#e6f4fa;border-color:#5aadd2;box-shadow:inset 0 0 0 1px #bee1f0}
.sector-choice.all{grid-column:1/-1;background:#f5fafc}
.sector-choice.all.on{background:#e3f2f9}
.sector-choice svg{height:32px;width:43px;flex:none}
.sector-choice .info{display:flex;min-width:0;flex:1;flex-direction:column;gap:3px}
.sector-choice b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sector-choice small{font-size:10px;color:#78909a}
.sector-choice .tick{height:18px;width:18px;border-radius:5px;border:1.5px solid #a9c6d5;display:grid;place-items:center;font-size:12px;color:transparent;flex:none}
.sector-choice.on .tick{color:white;border-color:#1688ac;background:#1688ac}
.sector-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;font-size:11px;color:#6d8793}
.sector-reset{background:#edf5f6;border:1px solid #d3e6e8;border-radius:10px;padding:9px;color:#205c69;font-size:11px;font-weight:800}
.sector-reset:disabled{opacity:.4}
.sector-note{margin-top:13px;color:#78919a;font-size:11px}
@media(max-width:355px){.sector-choice{padding:7px 5px;gap:5px}.sector-choice svg{width:32px}}

/* Aérodromes IFR : une couche exclusive au cyan électrique */
.layer.ifr.on{background:#e3faff;border-color:#35cde9;color:#064b61;box-shadow:inset 0 0 0 1px #90edff}
.layer.ifr.on em{color:#008bb0}
.layer.ifr:not(.on) .dot{box-shadow:0 0 0 1px #008cba1f}
.layer.ifr .dot{background:#00d8ff}
/* Profil à vue : sélection A puis B en une seule action */
.profile-choice-row{display:grid;grid-template-columns:1.35fr 1fr;gap:8px}
.profile-choice-row button{min-width:0;min-height:44px;border-radius:11px;padding:10px 9px;font-size:12px;font-weight:860}
.profile-select{background:#087e90;border:1px solid #087e90;color:white}
.profile-reset{background:#f9fcfd;border:1px solid #d5e5e9;color:#55737e}
.profile-selected{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.profile-tag{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%;font-size:11px;color:#527383;background:#f2f9fa;border:1px solid #dcebef;padding:4px 8px;border-radius:9px}
.profile-tag strong{flex:none;background:#0b8298;color:white;border-radius:5px;padding:3px 6px;font-weight:900;font-size:11px}
.profile-tag.b strong{background:#ab4b91}
.profile-tag span{overflow-wrap:anywhere;line-height:1.25}
.profile-controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.profile-controls label{font-size:11px;font-weight:780;color:#64828e}
.profile-controls input{display:block;margin-top:5px;width:100%;height:42px;padding:9px 11px;border:1px solid #d2e3e8;border-radius:10px;background:white;color:#163f4e;font-size:14px;font-weight:780}
.profile-bottom{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:12px 0;flex-wrap:wrap}
.profile-curvature{display:flex;align-items:center;gap:7px;font-size:11px;color:#5b7884;flex:1;min-width:170px;line-height:1.35}
.profile-curvature input{width:17px;height:17px;flex:none;accent-color:#09879a}
.profile-run{min-height:40px;background:#087e90;color:white;border:1px solid #087e90;border-radius:10px;padding:8px 17px;font-size:12px;font-weight:840;white-space:nowrap}
.profile-run:disabled{opacity:.45;cursor:not-allowed}
.profile-result{margin-top:6px;padding:12px 8px 5px;border-top:1px solid #e3eef0}
.profile-result-line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 3px}
.profile-result-line strong{font-size:12px;color:#16835f}
.profile-result-line.blocked strong{color:#c15c46}
.profile-result-line span{font-size:12px;font-weight:800;color:#527280;font-variant-numeric:tabular-nums}
.profile-chart{display:block;width:100%;height:auto;margin-top:9px}
.profile-legend{display:flex;justify-content:center;align-items:center;gap:17px;color:#718d97;font-size:10px;padding-bottom:3px}
.profile-legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.profile-marker{background:transparent!important;border:0!important}
.profile-marker>div{width:30px;height:30px;border:3px solid white;border-radius:10px;background:#087f9b;color:white;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 8px #123c4c8c}
.profile-marker.b>div{background:#ab4b91}
@media(max-width:355px){.profile-choice-row{gap:6px}.profile-choice-row button{font-size:11px;padding:8px 5px}.profile-curvature{min-width:145px;font-size:10px}.profile-run{padding:8px 10px}}
/* IMD : interface compacte adaptée aux cinq menus mobiles */
.imd-toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.imd-place{min-width:0;font-size:11px;color:#527381;background:#f3f9fa;padding:10px;border-radius:10px;overflow-wrap:anywhere}

.imd-calc{background:#087c90;color:white;border:0;border-radius:11px;min-height:43px;padding:10px 16px;font-weight:880;width:100%}
.imd-note{color:#708992;font-size:10px;line-height:1.5;margin:9px 0}
.imd-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 9px}
.imd-head strong{font-size:12px;color:#1a5161}.imd-head span{font-size:11px;color:#77909b}
.imd-flag{background:#fff0ed;color:#a64c40;border:1px solid #f0c4ba;border-radius:9px;padding:9px;font-weight:830;font-size:12px}
.imd-clear{background:#e9f7f1;color:#176e4e;border:1px solid #c5e9d9;border-radius:9px;padding:9px;font-weight:820;font-size:12px}

.imd-hit .imd-equation{font-size:11px;font-weight:790;color:#456b78;margin-top:4px;overflow-wrap:anywhere}
.imd-hit .imd-origins{color:#799099;font-size:10px;line-height:1.5;margin-top:5px;overflow-wrap:anywhere}

.imd-source{display:flex;gap:8px;border-top:1px solid #e8f0f2;padding:9px 0;font-size:11px}

.imd-anchor{background:transparent!important;border:0!important}
.imd-anchor div{width:24px;height:24px;border:3px solid white;background:#e28620;border-radius:50%;box-shadow:0 0 0 1px #8b5300,0 2px 9px #1b4b5844}

function profileSetPoint(i,latlng,label){
 const p=L.latLng(latlng.lat,latlng.lng);

 profileEnds[i]=p;profileLabels[i]=label||'';
 profileInvalidate();profileUpdateMarkers();
 if(profilePick){
  if(i===0&&!profileEnds[1]){
   profilePick='B';notice('Point A défini · sélectionnez maintenant B');
  }else{
   profilePick='';map.getContainer().style.cursor='';

  }
 }
}
function profileSnapPoint(latlng){
 if(!loaded)return {point:latlng,label:''};
 const target=map.latLngToContainerPoint(latlng);
 let best=24,found=null;
 for(const key of ['aerodromes','heliports','radionav','approach','navfix']){
  if(!cfg[key][2]||(key==='navfix'&&map.getZoom()<8))continue;
  for(const f of groups[key]){
   if(f.geometry.type!=='Point'||(key==='aerodromes'&&airportMode==='ifr'&&!isIFRAerodrome(f)))continue;
   const c=f.geometry.coordinates;
   const point=L.latLng(c[1],c[0]),px=map.latLngToContainerPoint(point);
   const d=Math.hypot(px.x-target.x,px.y-target.y);
   if(d<best){best=d;found=f;}
  }
 }
 if(!found)return {point:latlng,label:''};
 const c=found.geometry.coordinates;
 return {point:L.latLng(c[1],c[0]),label:profileFeatureName(found)};
}

function profileClear(){

function profileCompute(){
 if(!profileRaw||!profileEnds[0]||!profileEnds[1])return null;
 const z=profileRaw,dist=map.distance(profileEnds[0],profileEnds[1]);
 const R=EARTH_RADIUS,za=z[0]+profileHeights[0],zb=z[z.length-1]+profileHeights[1];
 const rows=[],top=dist*dist/(8*R),useCurve=profileCurvature;
 let obstruction=-Infinity,maskAt=0,maskIndex=-1;
 for(let i=0;i<z.length;i++){
  const t=i/(z.length-1),x=t*dist;
  // L'élévation intègre la courbure : la ligne de visée reste rigoureusement droite.
  // Le dégagement géométrique reste identique à la formulation précédente.
  const terrain=z[i]+(useCurve?x*(dist-x)/(2*R):0);
  const sight=za+(zb-za)*t;
  const penetration=terrain-sight;
  if(i>0&&i<z.length-1&&penetration>obstruction){
   obstruction=penetration;maskAt=x;maskIndex=i;
  }
  rows.push({dist:x,z:terrain,rawZ:z[i],sight,penetration});
 }
 return {rows,dist,za,zb,clear:obstruction<=.01,obstruction,maskAt,maskIndex,curvatureBulge:useCurve?top:0};
}
function profileChart(r){
 const w=650,h=245,ml=50,mr=16,mt=17,mb=33,iw=w-ml-mr,ih=h-mt-mb;
 const all=r.rows.flatMap(o=>[o.z,o.sight]);
 const lo=Math.floor((Math.min(...all)-10)/10)*10,hi=Math.ceil((Math.max(...all)+10)/10)*10;
 const extent=Math.max(1,hi-lo),xp=i=>ml+i/(r.rows.length-1)*iw,yp=z=>mt+(hi-z)/extent*ih;
 const terrain=r.rows.map((v,i)=>(i?'L':'M')+xp(i).toFixed(1)+' '+yp(v.z).toFixed(1)).join(' ');
 const sight=r.rows.map((v,i)=>(i?'L':'M')+xp(i).toFixed(1)+' '+yp(v.sight).toFixed(1)).join(' ');
 const fill=terrain+' L'+(ml+iw)+' '+(mt+ih)+' L'+ml+' '+(mt+ih)+' Z';
 let grid='';
 for(let i=0;i<=4;i++){
  const value=lo+(hi-lo)*i/4,y=yp(value);
  grid+='<path d="M'+ml+' '+y.toFixed(1)+'H'+(ml+iw)+'" stroke="#dfebef" stroke-width="1"/>'+
   '<text x="'+(ml-6)+'" y="'+(y+4).toFixed(1)+'" fill="#74909c" text-anchor="end" font-size="11">'+Math.round(value)+'</text>';
 }
 for(let i=0;i<=4;i++){
  const x=ml+iw*i/4,d=r.dist*i/4000;
  grid+='<text x="'+x.toFixed(1)+'" y="'+(h-9)+'" text-anchor="middle" fill="#74909c" font-size="11">'+d.toFixed(1)+'</text>';
 }
 const mx=r.maskIndex<0?0:xp(r.maskIndex);
 const mark=r.clear?'':'<circle cx="'+mx.toFixed(1)+'" cy="'+yp(r.rows[r.maskIndex].z).toFixed(1)+'" r="5" fill="#e34d3b" stroke="#fff" stroke-width="2"/>';
 return '<svg class="profile-chart" role="img" aria-label="Profil altimétrique et ligne de visée" viewBox="0 0 '+w+' '+h+'">'+
  '<defs><linearGradient id="profileFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#71c6bb" stop-opacity=".55"/><stop offset="1" stop-color="#e5f6f1" stop-opacity=".4"/></linearGradient></defs>'+
  grid+'<path d="'+fill+'" fill="url(#profileFill)"/><path d="'+terrain+'" fill="none" stroke="#168e7f" stroke-width="2.3" stroke-linejoin="round"/>'+
  '<path d="'+sight+'" fill="none" stroke="'+(r.clear?'#268ad0':'#d35b4a')+'" stroke-width="2.5" stroke-dasharray="8 4"/>'+mark+
  '<text x="'+(ml-37)+'" y="11" fill="#77929b" font-size="11">m</text><text x="'+(w-13)+'" y="'+(h-9)+'" text-anchor="end" fill="#77929b" font-size="11">km</text></svg>';
}
function profilesPanel(){

 const names=profileEnds.map((p,i)=>p?'<span class="profile-tag '+(i?'b':'')+'"><strong>'+(i?'B':'A')+'</strong>'+

 const result=r?'<div class="profile-result"><div class="profile-result-line '+(r.clear?'':'blocked')+'">'+

  (names?'<div class="profile-selected">'+names+'</div>':'')+

  '<label>Hauteur B (m)<input id="profileHeightB" type="number" inputmode="decimal" min="0" max="2000" step="1" value="'+profileHeights[1]+'"></label></div>'+

  '<button id="profileRun" class="profile-run" '+(!hasBoth||profileLoading?'disabled':'')+'>'+
  (profileLoading?'Chargement…':profileRaw?'Recalculer':'Tracer')+'</button></div>'+
  result);

  $('profileHeight'+(i?'B':'A')).onchange=e=>{

   profileResult=profileRaw?profileCompute():null;
   profileUpdateTrack();profilesPanel();
  };
 }
 $('profileCurved').onchange=e=>{
  profileCurvature=e.target.checked;
  profileResult=profileRaw?profileCompute():null;

}
async function profileFetch(){
 if(!profileEnds[0]||!profileEnds[1]||profileLoading)return;
 const nonce=++profileNonce,ends=profileEnds.map(p=>L.latLng(p.lat,p.lng));
 profileLoading=true;profileResult=null;profilesPanel();
 const url=new URL(PROFILE_ALTI);
 url.searchParams.set('lon',ends.map(p=>p.lng.toFixed(7)).join('|'));
 url.searchParams.set('lat',ends.map(p=>p.lat.toFixed(7)).join('|'));
 url.searchParams.set('delimiter','|');
 url.searchParams.set('resource','ign_rge_alti_wld');
 url.searchParams.set('sampling','200');
 url.searchParams.set('profile_mode','simple');
 url.searchParams.set('indent','false');
 url.searchParams.set('measures','false');
 url.searchParams.set('zonly','false');
 try{
  const res=await fetch(url.toString(),{mode:'cors',cache:'no-store'});
  if(!res.ok)throw Error('IGN : HTTP '+res.status);
  const json=await res.json(),elevations=json.elevations;
  if(!Array.isArray(elevations)||elevations.length<2)throw Error('Profil IGN non reçu');
  const zs=elevations.map(v=>typeof v==='number'?v:Number(v.z));
  if(zs.some(v=>!Number.isFinite(v)||v<=-9999))throw Error('Relief IGN indisponible sur une partie du trajet');
  if(nonce!==profileNonce)return;
  profileRaw=zs;profileResult=profileCompute();profileUpdateTrack();
  if(mode==='profiles')profilesPanel();
 }catch(err){
  if(nonce!==profileNonce)return;
  profileRaw=null;profileResult=null;profileUpdateTrack();
  notice(err.message||'Impossible de récupérer le profil IGN');
  if(mode==='profiles')profilesPanel();
 }finally{
  if(nonce===profileNonce){profileLoading=false;if(mode==='profiles')profilesPanel();}
 }
}


/* Intermodulation ordre 3 : analyse arithmétique des fréquences SIA déclarées. */
function imdPointActive(){return imdPoint||map.getCenter()}
function imdFormat(khz){return (khz/1000).toFixed(3)}
function imdSetPoint(point){
 imdPoint=L.latLng(point.lat,point.lng);imdChoosing=false;imdResult=null;
 map.getContainer().style.cursor='';
 if(imdMarker){imdOverlay.removeLayer(imdMarker);imdMarker=null;}
 imdMarker=L.marker(imdPoint,{draggable:true,zIndexOffset:800,
  icon:L.divIcon({className:'imd-anchor',html:'<div></div>',iconSize:[24,24],iconAnchor:[12,12]})
 }).addTo(imdOverlay);
 imdMarker.on('dragend',()=>{imdSetPoint(imdMarker.getLatLng());imdPanel()});
 updateDock();imdPanel();
}
function imdChooseOnMap(){
 imdChoosing=true;
 hide();map.getContainer().style.cursor='crosshair';

}
function imdDistanceBBox(p,b){
 if(!b||b.length!==4)return Infinity;
 const lat=Math.min(Math.max(p.lat,b[1]),b[3]);
 const lng=Math.min(Math.max(p.lng,b[0]),b[2]);
 return map.distance(p,L.latLng(lat,lng))/1000;
}
function imdDistanceFeature(f,p,radius){
 const g=f.geometry;
 if(g.type==='Point'){const c=g.coordinates;return map.distance(p,L.latLng(c[1],c[0]))/1000;}
 const dbox=imdDistanceBBox(p,f._b);
 if(dbox>radius)return Infinity;
 if(g.type==='Polygon'||g.type==='MultiPolygon'){
  if(inside(f,p))return 0;
  const cos=Math.max(.05,Math.cos(p.lat*Math.PI/180)),scaleX=111.195*cos,scaleY=111.195;
  let best=Infinity;
  const walk=part=>{
   if(!Array.isArray(part)||!part.length)return;
   if(Array.isArray(part[0])&&typeof part[0][0]==='number'){
    for(let i=1;i<part.length;i++){

function imdCollect(){

   if(type==='airspaces'&&['FIR','UIR','UTA','LTA'].includes(String(p.type||'').toUpperCase()))continue;

   if(type==='radionav'&&/^(DME|TACAN)/i.test(String(p.type||'')))continue;

   if(!Number.isFinite(distance)||distance>imdRadius)continue;

    const mhz=Number(v.freq);

   });
   if(!rows.length)continue;
   const src={type,name:profileFeatureName(f),code:p.code||'',distance,rows,unit:p.type||'',feature:f};

    const k=Math.round(Number(row.freq)*1000);

map.on('click',e=>{if(imdChoosing){imdSetPoint(e.latlng);return;}if(profileMapClick(e.latlng))return;if(!loaded){notice('Chargement SIA en cours');return}const p=e.latlng,list=cfg.airspaces[2]?at(p):[],c=p.lat.toFixed(6)+', '+p.lng.toFixed(6);show('point','Secteurs à ce point',c,'<div class="section"><div class="label">'+list.length+' espace(s) aérien(s)</div><div class="results">'+(list.length?list.slice(0,65).map(row).join(''):'<p class="mutedtext">Aucun secteur actif dans les filtres.</p>')+'</div></div><div class="section"><button class="btn muted" id="copy">⧉ Copier '+c+'</button></div>');$('copy').onclick=()=>navigator.clipboard.writeText(c).then(()=>notice('Coordonnées copiées')).catch(()=>notice('Copie impossible'));bind()});
function updateDock(){
 cfg.airspaces[2]=selectedSectors.size>0;
 $('sectors').classList.toggle('on',cfg.airspaces[2]);

function sectorsPanel(){
 const previous=mode==='sectors'?$('body').scrollTop:0,types=sectorTypes(),all=types.length>0&&types.every(k=>selectedSectors.has(k));
 const n=selectedSectors.size;
 function option(k,isAll){
  const active=isAll?all:selectedSectors.has(k),total=isAll?groups.airspaces.length:(sectorCounts[k]||0);
  const sample=isAll?'<svg aria-hidden="true" viewBox="0 0 54 36"><path d="M5 31V6H49V31" stroke="#1766b2" stroke-width="2.5" fill="none"/><path d="M9 22H45" stroke="#178b61" stroke-width="2" stroke-dasharray="8 4"/></svg>':sectorSample(k);
  return '<button type="button" class="sector-choice '+(isAll?'all ':'')+(active?'on':'')+'" data-sector="'+esc(k)+'" aria-pressed="'+active+'">'+sample+
   '<span class="info"><b>'+esc(isAll?'Tous les secteurs':sectorNames[k]||k)+'</b><small>'+total.toLocaleString('fr-FR')+' espaces</small></span>'+
   '<span class="tick" aria-hidden="true">'+(active?'✓':'')+'</span></button>';
 }
 show('sectors','Secteurs',n+' type'+(n>1?'s':'')+' actif'+(n>1?'s':''),
  '<div class="sector-controls"><span>Sélection multiple · '+n+' / '+types.length+'</span><button id="sectorReset" type="button" class="sector-reset"'+(n?'':' disabled')+'>Tout masquer</button></div>'+
  '<div class="sector-row">'+option('ALL',true)+types.map(k=>option(k,false)).join('')+'</div>'+
  (loaded?'':'<p class="sector-note">Chargement des données SIA…</p>')+
  '<p class="sector-note">Chaque type choisi s’ajoute à la carte. Un second appui le masque.</p>');
 $('body').scrollTop=previous;
 $('sectorReset').onclick=()=>{selectedSectors.clear();updateDock();redraw();sectorsPanel()};
 document.querySelectorAll('[data-sector]').forEach(b=>b.onclick=()=>{
  const k=b.dataset.sector;
  if(k==='ALL'){if(all)selectedSectors.clear();else types.forEach(t=>selectedSectors.add(t))}
  else if(selectedSectors.has(k))selectedSectors.delete(k);else selectedSectors.add(k);
  updateDock();redraw();sectorsPanel();
 });
}
function elementsPanel(){
 const airportTotal=groups.aerodromes.length;
 const airportIFR=groups.aerodromes.filter(isIFRAerodrome).length;
 const airportTile=(kind,title,count,tint)=>{
  const active=cfg.aerodromes[2]&&airportMode===kind;
  const extra=kind==='ifr'?' ifr':'';
  return '<button type="button" class="layer'+extra+(active?' on':'')+'" data-airport-layer="'+kind+'" aria-pressed="'+active+'">'+
   '<span class="dot" style="--c:'+tint+'"></span><span><b>'+title+'</b><small>'+count+' objets</small></span><em>'+(active?'✓':'+')+'</em></button>';
 };
 const ordinaryTile=([key,def])=>'<button type="button" class="layer '+(def[2]?'on':'')+
  '" data-layer="'+key+'" aria-pressed="'+def[2]+'">'+
  '<span class="dot" style="--c:'+def[1]+'"></span><span><b>'+def[0]+'</b><small>'+groups[key].length+
  ' objets</small></span><em>'+(def[2]?'✓':'+')+'</em></button>';
 // Les deux modes aérodromes occupent des cases indépendantes de la même grille.
 // Une seule valeur airportMode contrôle les deux : impossible de les cumuler.
 const tiles=Object.entries(cfg).filter(([key])=>key!=='airspaces')
  .map(entry=>entry[0]==='aerodromes'
   ?airportTile('all','Aérodromes',airportTotal,cfg.aerodromes[1])+
    airportTile('ifr','Aérodromes IFR',airportIFR,IFR_CYAN)
   :ordinaryTile(entry))
  .join('');
 show('elements','Couches','Aérodromes, navigation et infrastructures',
  '<div class="section"><div class="layers">'+tiles+'</div></div>');
 document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{
  cfg[b.dataset.layer][2]=!cfg[b.dataset.layer][2];
  redraw();updateDock();elementsPanel();
 });
 document.querySelectorAll('[data-airport-layer]').forEach(b=>b.onclick=()=>{
  const chosen=b.dataset.airportLayer;
  if(cfg.aerodromes[2]&&airportMode===chosen){
   cfg.aerodromes[2]=false; // second appui : désactiver la couche
  }else{
   airportMode=chosen;
   cfg.aerodromes[2]=true; // sélection exclusive « Tous » ou « IFR »
  }
  redraw();updateDock();elementsPanel();
 });
}
function bases(){show('base','Fond de carte','Choisissez un fond fiable','<div class="results">'+Object.entries(backgrounds).map(([k,v])=>'<button class="item" type="button" data-base="'+k+'"><span class="stripe" style="--c:'+(bgName===k?'#12bdac':'#cbdede')+'"></span><span><b>'+v[0]+(bgName===k?' ✓':'')+'</b><small>Une seconde source prend le relais en cas d’échec</small></span><span class="arrow">›</span></button>').join('')+'</div><div class="section"><button class="btn muted" id="refresh">↻ Recharger les tuiles</button></div>');
document.querySelectorAll('[data-base]').forEach(b=>b.onclick=()=>{setBase(b.dataset.base);hide()});$('refresh').onclick=()=>{setBase(bgName);hide()}}
$('sectors').onclick=sectorsPanel;
$('elements').onclick=elementsPanel;
$('bases').onclick=bases;
$('profiles').onclick=profilesPanel;
$('imd').onclick=imdPanel;
const searchCategories=[['all','Tout'],['airspaces','Secteurs'],['aerodromes','Aérodromes'],['freq','Freq'],['navfix','NavFix']];
function extractFrequencyNumber(s){
 const m=String(s||'').replace(',','.').match(/(?:^|[^\d])(\d{2,3}(?:\.\d{1,3})?)(?![\d.])/);
 return m?m[1]:null;
}
function normalizeFrequency(s){
 const raw=extractFrequencyNumber(s);
 return raw===null?null:Number(raw).toFixed(3);
}
function describeOwner(f){
 const p=f.properties;
 const layer=cfg[p.layer]?.[0]||'Élément';
 const name=[p.type,p.name,p.code].filter(Boolean).join(' ').trim();
 return {kind:layer,name:p.layer==='airspaces'?(name||p.label||'Secteur'):(p.label||name||layer)};
}
function frequencyRows(f){
 const p=f.properties,owner=describeOwner(f),out=[],seen=new Set();
 const add=(raw,service,unit)=>{
  const key=normalizeFrequency(raw);
  if(!key)return;
  const label=String(service||'').trim().toUpperCase()||'FRÉQUENCE';
  const station=String(unit||'').trim();
  const dedup=[key,label,station].join('|');
  if(seen.has(dedup))return;
  seen.add(dedup);
  out.push({freq:key,service:label,unit:station,owner:owner.name,kind:owner.kind,feature:f,code:p.code||''});
 };
 const detail=Array.isArray(p.frequency_details)?p.frequency_details:[];
 if(detail.length){
  detail.forEach(r=>r&&add(r.frequency||r.transmission||r.reception,r.display_type||r.service_type||r.service_label||r.frequency_type_label,r.unit));
 }else if(p.frequency){
  String(p.frequency).split(/\s*[|;,]\s*/).forEach(freq=>add(freq,p.service_type||p.type||'Fréquence',p.station));
 }
 return out;
}
function parseSearch(input){
 const t=String(input||'').trim();
 const exact=t.startsWith('"')||t.endsWith('"');
 const value=t.replace(/^"+|"+$/g,'').trim();
 const term=norm(value);
 const numeric=/^\d{2,3}(?:[.,]\d{1,3})?$/.test(value)?normalizeFrequency(value):null;
 return {raw:value,term,exact,numeric,tokens:term.split(' ').filter(Boolean)};
}
function exactText(fields,term){
 if(!term)return false;
 return fields.some(x=>{const v=norm(x);return v===term||(' '+v+' ').includes(' '+term+' ')});
}
function searchFrequency(frequency,query){
 const fields=[frequency.owner,frequency.kind,frequency.code,frequency.service,frequency.unit];
 if(!query.term)return false;
 if(query.exact){
  if(query.numeric)return frequency.freq===query.numeric;
  return exactText([frequency.freq,...fields],query.term);
 }
 const full=norm([frequency.freq,...fields].join(' '));
 return query.tokens.every(t=>full.includes(t));
}
function searchWords(text){
 return String(text||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
  .replace(/[^a-z0-9.-]+/g,' ').trim().split(/\s+/).filter(Boolean);
}
function matchesFeature(f,source,query){
 if(!query.term)return false;
 if(query.numeric){
  return (f._freqKeys||[]).some(freq=>query.exact?freq===query.numeric:
   freq.startsWith(query.raw.replace(',','.')));
 }
 const p=f.properties;
 const fields=[p.code,p.name,p.label].filter(Boolean).map(searchWords);
 const wanted=searchWords(query.raw);
 if(!wanted.length)return false;
 if(query.exact){
  const phrase=wanted.join(' ');
  return fields.some(words=>words.join(' ')===phrase||(' '+words.join(' ')+' ').includes(' '+phrase+' '));
 }
 return wanted.every(token=>fields.some(words=>words.some(word=>
  word===token||(token.length>=3&&word.startsWith(token))
 )));
}
function frequencyResult(row){
 return '<div class="freqresult" style="--c:'+esc(cfg[row.feature.properties.layer][1])+'">'+
 '<div class="freqresult-head"><b>'+esc(row.freq)+' <small>MHz</small></b><span class="freqservice">'+esc(row.service)+'</span></div>'+
 '<div class="freqowner">'+esc(row.kind)+' · '+esc(row.owner)+'</div>'+
 (row.unit&&norm(row.owner).indexOf(norm(row.unit))===-1?'<div class="frequnit">'+esc(row.unit)+'</div>':'')+'</div>';
}
function refreshSearchViewport(){
 if(mode!=='search')return;
 const vv=window.visualViewport;
 const viewTop=vv?vv.offsetTop:0;
 const viewHeight=vv?vv.height:window.innerHeight;
 const searchBottom=$('q').getBoundingClientRect().bottom+7;
 const panelTop=Math.max(viewTop+6,searchBottom);
 const free=Math.max(74,viewTop+viewHeight-panelTop-7);
 const style=document.documentElement.style;
 style.setProperty('--search-panel-top',Math.round(panelTop)+'px');
 style.setProperty('--search-panel-height',Math.round(free)+'px');
}
function results(){
 const query=parseSearch($('q').value);
 $('clear').style.display=$('q').value?'block':'none';
 const chips='<div class="chips searchchips" role="group" aria-label="Filtrer la recherche">'+
  searchCategories.map(([key,label])=>'<button type="button" class="chip '+(category===key?'on':'')+
  '" aria-pressed="'+(category===key)+'" data-cat="'+key+'">'+label+'</button>').join('')+'</div>';
 const guide='<p class="mutedtext searchguide">Recherche partielle : 125.03 · Recherche exacte : "125.030"</p>';
 if(!loaded){
  show('search','Recherche SIA','Chargement des données…',chips+'<p class="mutedtext">Chargement des données SIA…</p>');
 }else if(category==='freq'){
  let matches=[];
  if(query.term){
   for(const r of frequencyEntries)if(searchFrequency(r,query))matches.push(r);
   matches.sort((a,b)=>a.freq.localeCompare(b.freq)||a.service.localeCompare(b.service)||a.owner.localeCompare(b.owner,'fr'));
  }
  show('search','Recherche SIA',query.term?matches.length+' fréquence(s)':'Rechercher une fréquence',
    chips+guide+'<div class="freqresults">'+
    (query.term?(matches.slice(0,100).map(frequencyResult).join('')||'<p class="mutedtext">Aucune fréquence correspondante.</p>'):
     '<p class="mutedtext">Tape une fréquence, un service (APP, TWR…), un aérodrome ou un secteur.</p>')+'</div>');
 }else{
  let found=[];
  if(query.term)for(let i=0;i<features.length;i++){
   const f=features[i];
   if(category!=='all'&&f.properties.layer!==category)continue;
   if(matchesFeature(f,finder[i],query))found.push(f);
  }
  found.sort((a,b)=>{
   const score=f=>{const p=f.properties,v=norm(p.code),n=norm(p.name);
    return v===query.term?0:v.startsWith(query.term)?1:n===query.term?2:n.startsWith(query.term)?3:4};
   return score(a)-score(b);
  });
  show('search','Recherche SIA',query.term?found.length+' résultat(s) · '+Math.min(found.length,55)+' affiché(s)':'Nom, code, fréquence',
   chips+guide+'<div class="results">'+(query.term?
    (found.slice(0,55).map(row).join('')||'<p class="mutedtext">Aucun résultat.</p>'):
    '<p class="mutedtext">Exemples : LFBO, NICE, LFR162, 125.030.</p>')+'</div>');
 }
 document.querySelectorAll('[data-cat]').forEach(b=>{b.addEventListener('pointerdown',e=>e.preventDefault());b.onclick=()=>{category=b.dataset.cat;results()}});
 bind();
}

let qt=0;$('q').addEventListener('focus',()=>{results();refreshSearchViewport()});$('q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(results,90)});$('clear').onclick=()=>{$('q').value='';results();$('q').focus()};
window.addEventListener('resize',()=>{if(mode==='search')refreshSearchViewport()},{passive:true});
if(window.visualViewport){window.visualViewport.addEventListener('resize',refreshSearchViewport,{passive:true});window.visualViewport.addEventListener('scroll',refreshSearchViewport,{passive:true});}

function accept(data){
 features=data.filter(f=>f&&f.geometry&&f.properties&&cfg[f.properties.layer]);
 finder=[];lookup.clear();frequencyEntries=[];
 Object.keys(cfg).forEach(k=>groups[k]=[]);
 for(const f of features){
  f._b=Array.isArray(f.properties.bbox)?f.properties.bbox:bb(f.geometry);
  groups[f.properties.layer].push(f);lookup.set(id(f),f);
  if(f.properties.layer==='airspaces'){const k=sectorType(f);sectorCounts[k]=(sectorCounts[k]||0)+1;}
  const p=f.properties;
  const fr=frequencyRows(f);
  f._freqKeys=[...new Set(fr.map(row=>row.freq))];
  frequencyEntries.push(...fr);
  finder.push(norm([p.name,p.label,p.code,p.type,p.frequency,p.service,p.remarks,p.station,p.manager,p.frequency_details&&JSON.stringify(p.frequency_details)].filter(Boolean).join(' ')));
 }
 loaded=true;status(features.length.toLocaleString('fr-FR')+' objets · 01/10/2026');
 $('status').classList.add('ok');redraw();updateDock();
 if(mode==='search')results();
 if(mode==='sectors')sectorsPanel();
 if(mode==='elements')elementsPanel();
 if(mode==='imd')imdPanel();
}

async function load(){try{const r=await fetch('./sia-manifest.json',{cache:'no-store'});if(!r.ok)throw Error('manifest inaccessible');const m=await r.json();let fs=[];for(let i=0;i<m.chunks.length;i+=4){const a=await Promise.all(m.chunks.slice(i,i+4).map(async n=>{const r=await fetch('./'+n);if(!r.ok)throw Error(n);return(await r.json()).features}));fs.push(...a.flat());status('SIA '+Math.min(i+4,m.chunks.length)+'/'+m.chunks.length)}accept(fs)}catch(e){status('Données indisponibles');$('hint').textContent='Données SIA indisponibles';notice('Erreur de chargement SIA');console.error(e)}}
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(v=>v.filter(r=>new URL(r.scope).pathname.startsWith('/suivi-air-sol/Voliere/')).forEach(r=>r.unregister())).catch(()=>{});
if('caches' in window)caches.keys().then(v=>v.filter(k=>k.startsWith('voliere-')).forEach(k=>caches.delete(k))).catch(()=>{});
window.addEventListener('resize',()=>map.invalidateSize({animate:false}),{passive:true});window.addEventListener('orientationchange',()=>setTimeout(()=>map.invalidateSize({animate:false}),250));
load();
})();
