name: Assemble SIA GeoJSON

on:
  push:
    branches: [main]
    paths:
      - 'data/.sia_upload/**'
      - '.github/workflows/assemble-sia.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble GeoJSON
        shell: bash
        run: |
          cat data/.sia_upload/part_*.txt > data/SIA_2026-10-01.geojson
          python - <<'PY'
          import json
          p = "data/SIA_2026-10-01.geojson"
          with open(p, "r", encoding="utf-8") as f:
              json.load(f)
          print("GeoJSON valide")
          PY

      - name: Commit assembled file
        shell: bash
        run: |
          rm -rf data/.sia_upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/SIA_2026-10-01.geojson data/.sia_upload
          git commit -m "Ajout SIA 2026-10-01"
          git push
