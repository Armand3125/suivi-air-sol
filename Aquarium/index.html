 createTile(coords,done){
  const img=document.createElement('img');

   if(ended)return;

 }
});

function status(message,ready=false){$('statusText').textContent=message;$('statusDot').classList.toggle('ready',ready)}
function layerColor(key){return CONFIG[key]?.color||'#1767c9'}
function toLatLng(c){return [c[1],c[0]]}
function boundsGeometry(g){if(!g)return null;let west=Infinity,south=Infinity,east=-Infinity,north=-Infinity;const walk=c=>{if(!Array.isArray(c))return;if(typeof c[0]==='number'&&typeof c[1]==='number'){const lon=c[0],lat=c[1];if(Number.isFinite(lon)&&Number.isFinite(lat)){west=Math.min(west,lon);east=Math.max(east,lon);south=Math.min(south,lat);north=Math.max(north,lat)}return;}for(const v of c)walk(v)};walk(g.coordinates);return Number.isFinite(west)?[west,south,east,north]:null}
function intersects(a,b){return a&&b&&a[0]<=b[2]&&a[2]>=b[0]&&a[1]<=b[3]&&a[3]>=b[1]}
function viewportBBox(){const b=map.getBounds().pad(.25);return[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()]}
function titleOf(f){const p=f.properties||{};return p.label||[p.type,p.name,p.code].filter(Boolean).join(' ')||'Sans nom'}
function secondary(f){const p=f.properties||{};const items=[];if(p.code&&!titleOf(f).includes(p.code))items.push(p.code);if(p.layer==='airspaces'){if(p.lower||p.upper)items.push(`${fmtLevel(p.lower)||'?'} → ${fmtLevel(p.upper)||'?'}`);if(p.class)items.push(`Classe ${p.class}`)}else if(p.frequency)items.push(p.frequency+' MHz');else if(p.alt_ft)items.push(p.alt_ft+' ft');return items.join(' · ')||CONFIG[p.layer]?.name||''}
function fmtLevel(x){const t=String(x??'').trim();let m=t.match(/^(\d+)\s*FL$/i)||t.match(/^FL\s*(\d+)$/i);return m?'FL'+m[1].padStart(3,'0'):t}
function objId(f){return String(f.properties?.id||f.id||'')}
function centroid(f){const g=f.geometry||{};if(g.type==='Point')return toLatLng(g.coordinates);const b=f._bbox||boundsGeometry(g);return b?[(b[1]+b[3])/2,(b[0]+b[2])/2]:[46.5,2.2]}
function isInsideRing(pt,ring){let inside=false;const x=pt.lng,y=pt.lat;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))inside=!inside;}return inside}
function insidePolygon(point,coords){if(!coords||!coords[0]||!isInsideRing(point,coords[0]))return false;for(let h=1;h<coords.length;h++)if(isInsideRing(point,coords[h]))return false;return true}
function containsSector(f,pt){const g=f.geometry||{};if(g.type==='Polygon')return insidePolygon(pt,g.coordinates);if(g.type==='MultiPolygon')return g.coordinates.some(p=>insidePolygon(pt,p));return false}
function sectorHere(latlng){const ll=latlng;return groups.airspaces.filter(f=>{const b=f._bbox;return b&&ll.lng>=b[0]&&ll.lng<=b[2]&&ll.lat>=b[1]&&ll.lat<=b[3]&&containsSector(f,ll)&&sectorTypeAllowed(f)}).sort((a,b)=>{const ca=typeRank(a.properties.type),cb=typeRank(b.properties.type);return ca-cb||((a._bbox[2]-a._bbox[0])*(a._bbox[3]-a._bbox[1]))-((b._bbox[2]-b._bbox[0])*(b._bbox[3]-b._bbox[1]))}).slice(0,60)}
function typeRank(t){return ({CTR:1,TMA:2,R:3,D:4,P:5,CTA:6,SECTOR:7,RAS:8})[String(t||'').toUpperCase()]||9}
function typeCategory(t){const v=String(t||'').toUpperCase();return ['CTR','TMA','R','D','P'].includes(v)?v:'Autres'}
function sectorTypeAllowed(f){return typeFilter==='ALL'||typeCategory(f.properties?.type)===typeFilter}
function featureFromPoint(f){const p=f.properties;const style=layerColor(p.layer);const r=p.layer==='navfix'?7:15;const icon=L.divIcon({html:`<div class="locationPin ${r===7?'tiny':''}" style="--pincolor:${style}"></div>`,className:'sia-pin',iconSize:[r,r],iconAnchor:[r/2,r/2]});return L.marker(toLatLng(f.geometry.coordinates),{icon,keyboard:false,riseOnHover:true})}
function plotFeature(f){const key=f.properties?.layer;const g=f.geometry;
 if(key==='airspaces'){const st={color:sectorStroke(f.properties.type),weight:map.getZoom()<7?1.2:1.7,opacity:.78,fillColor:sectorStroke(f.properties.type),fillOpacity:.065,interactive:false,smoothFactor:1.5};return L.geoJSON(f,{style:st,interactive:false}).addTo(sectorGroup)}
 if(g.type==='Point'){const m=featureFromPoint(f).addTo(pointGroup);m.on('click',ev=>{L.DomEvent.stopPropagation(ev);showDetail(f,true)});return m}
 const line=L.geoJSON(f,{style:{color:layerColor(key),weight:key==='runways'?4:2.8,opacity:.88,dashArray:key==='routes'?'7 5':undefined},interactive:true}).addTo(lineGroup);
 line.on('click',ev=>{L.DomEvent.stopPropagation(ev);showDetail(f,true)});return line
}
function sectorStroke(t){const v=String(t||'').toUpperCase();return ({R:'#fc8376',D:'#f0c36b',P:'#f590b6',CTR:'#26d6cd',TMA:'#39a6ee',CTA:'#8db9e9',TRA:'#d9b16a'})[v]||'#567aa3'}
function rerender(){if(!dataReady)return;const token=++renderSerial;sectorGroup.clearLayers();pointGroup.clearLayers();lineGroup.clearLayers();layerById.clear();const view=viewportBBox();let total=0;for(const key of ORDER){if(!CONFIG[key].visible)continue;const eligible=groups[key].filter(f=>intersects(f._bbox,view)&&(key!=='airspaces'||sectorTypeAllowed(f)));const max=key==='airspaces'?650:key==='navfix'?300:key==='routes'?450:550;if(eligible.length>max){const center=map.getCenter();eligible.sort((a,b)=>{let ac=centroid(a),bc=centroid(b);return Math.abs(ac[0]-center.lat)+Math.abs(ac[1]-center.lng)-Math.abs(bc[0]-center.lat)-Math.abs(bc[1]-center.lng)});}for(const f of eligible.slice(0,max)){const l=plotFeature(f);layerById.set(objId(f),l);total++}}$('welcome').textContent='Touchez la carte pour voir les zones';}
function scheduleRender(){clearTimeout(drawTimer);drawTimer=setTimeout(rerender,100)}
map.on('moveend zoomend',scheduleRender);
function showPanel(type,title,sub,html){openPanel=type;$('sheetTitle').textContent=title;$('sheetSub').textContent=sub||'';$('sheetBody').innerHTML=html;$('sheet').classList.add('open');$('sheet').setAttribute('aria-hidden','false');$('shade').classList.add('visible');document.querySelectorAll('.navbtn').forEach(el=>el.classList.remove('active'));if(type==='layers')$('layersBtn').classList.add('active');if(type==='base')$('baseBtn').classList.add('active');}
function closePanel(){openPanel='';$('sheet').classList.remove('open');$('sheet').setAttribute('aria-hidden','true');$('shade').classList.remove('visible');document.querySelectorAll('.navbtn').forEach(el=>el.classList.remove('active'));$('sectorsBtn').classList.toggle('active',CONFIG.airspaces.visible);if(document.activeElement?.id==='searchInput')document.activeElement.blur()}
$('sheetClose').addEventListener('click',closePanel);$('shade').addEventListener('click',closePanel);document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
function wherePanel(latlng){if(!dataReady){inform('Les données SIA ne sont pas encore chargées');return;}lastTouch=latlng;const matches=CONFIG.airspaces.visible?sectorHere(latlng):[];const lat=latlng.lat.toFixed(6),lon=latlng.lng.toFixed(6);const head=`<div class="sheetSection"><div class="slabel">Point sélectionné</div><div class="btnrow"><button class="action ghost" id="copyPoint" type="button">⧉ ${lat}, ${lon}</button><button class="action ghost" id="searchNear" type="button">🔎 Autour de ce point</button></div></div>`;const html=`${head}<div class="sheetSection"><div class="slabel">${matches.length} espace${matches.length!==1?'s':''} aérien${matches.length!==1?'s':''} à ce point</div><div class="resultList">${matches.length?matches.map(f=>resultHtml(f)).join(''):'<p class="subtle">Aucun secteur affiché à ce point. Activez les secteurs ou ajustez leurs filtres.</p>'}</div></div>`;showPanel('point',`Zones à cet endroit`,`${lat}° · ${lon}°`,html);$('copyPoint').onclick=()=>copyText(`${lat}, ${lon}`);$('searchNear').onclick=()=>{closePanel();map.setView(latlng,Math.max(10,map.getZoom()));};linkResults();}
function resultHtml(f){const p=f.properties||{},color=p.layer==='airspaces'?sectorStroke(p.type):layerColor(p.layer);return `<button class="resultItem" data-feature="${esc(objId(f))}" type="button"><span class="resultSwatch" style="--swatch:${color}"></span><span><span class="resultTitle">${esc(titleOf(f))}</span><span class="resultMeta">${esc(CONFIG[p.layer]?.name||'')} · ${esc(secondary(f))}</span></span><span class="arrow">›</span></button>`}
const featureMap=new Map();
function linkResults(){document.querySelectorAll('[data-feature]').forEach(el=>el.addEventListener('click',()=>{const f=featureMap.get(el.dataset.feature);if(f)showDetail(f,true)}))}
function selectHighlight(f){highlightGroup.clearLayers();if(!f)return;const key=f.properties?.layer;let l;if(f.geometry.type==='Point'){const ll=toLatLng(f.geometry.coordinates);l=L.circleMarker(ll,{radius:16,color:'#f5a623',weight:4,fillColor:'#ffffff',fillOpacity:.15,opacity:1}).addTo(highlightGroup)}else l=L.geoJSON(f,{style:{color:'#f6b233',weight:4,opacity:1,fillColor:'#ffc14c',fillOpacity:.21,dashArray:undefined},interactive:false}).addTo(highlightGroup);selectionLayer=l;}
function zoomFeature(f){if(f.geometry.type==='Point'){map.setView(toLatLng(f.geometry.coordinates),Math.max(12,map.getZoom()),{animate:true});return;}try{const b=L.geoJSON(f).getBounds();if(b.isValid())map.fitBounds(b.pad(.07),{maxZoom:12,padding:[32,32],animate:true});}catch{map.setView(centroid(f),10)}}
function detailRow(k,v){return `<div class="drow"><span class="dkey">${esc(FIELDS[k]||k)}</span><span class="dval">${esc(v)}</span></div>`}
function freqMarkup(f){const p=f.properties||{},details=Array.isArray(p.frequency_details)?p.frequency_details:[];if(details.length){const uniq=[];const seen=new Set();for(const d of details){const freq=d.frequency||d.transmission||d.reception;if(!freq)continue;const key=freq+'|'+(d.service_type||'')+'|'+(d.unit||'');if(seen.has(key))continue;seen.add(key);uniq.push(`<div class="freqline"><span class="freqnum">${esc(freq.replace(/\s*mhz/ig,''))}<small style="font-size:9px;font-weight:650"> MHz</small></span><span class="freqmeta">${esc([d.service_label||d.display_type||d.service_type,d.unit,d.callsign].filter(Boolean).join(' · '))}${d.remarks?'<div>'+esc(d.remarks)+'</div>':''}</span></div>`)}if(uniq.length)return `<div class="slabel">Fréquences du service</div><div class="freqgrid">${uniq.join('')}</div>`}return p.frequency?`<div class="slabel">Fréquence</div><div class="freqgrid"><div class="freqline"><b class="freqnum">${esc(p.frequency)}</b></div></div>`:''}
function showDetail(f,zoom=false){selected=f;selectHighlight(f);if(zoom)zoomFeature(f);const p=f.properties||{},isSector=p.layer==='airspaces';const kind=CONFIG[p.layer]?.name||'SIA';const lvl=isSector?`<div class="levels"><div class="level"><small>Plancher</small><b>${esc(fmtLevel(p.lower)||'—')}</b></div><div class="level"><small>Plafond</small><b>${esc(fmtLevel(p.upper)||'—')}</b></div></div>`:'';
const extraKeys=isSector?['class','work_hr','service','remarks']:['frequency','status','alt_ft','traffic_ifr','traffic_vfr','ifr','night','hours','usage','range','vertical_range_fl','station','situation','operator','manager','phone','afs','lighting','runway','length_m','width_m','surface','resistance','orientation_geo','lda1','lda2','origin','end','distance_nm','mag_track','acc','moca','segment_type','route_type','remarks'];
const rows=extraKeys.filter(k=>p[k]!==undefined&&p[k]!==null&&String(p[k]).trim()&& !(k==='frequency'&&Array.isArray(p.frequency_details)&&p.frequency_details.length)).map(k=>detailRow(k,p[k])).join('');
const center=centroid(f);let code=p.code||p.type||'SIA';let html=`<div class="itemHero"><div class="itemIcon" style="--herocolor:${isSector?sectorStroke(p.type):layerColor(p.layer)}">${esc(String(code).slice(0,6))}</div><div class="heroText"><strong>${esc(titleOf(f))}</strong><span>${esc(kind)}${p.class?' · Classe '+esc(p.class):''}</span></div></div>${lvl}${freqMarkup(f)}${rows?`<div class="detailRows">${rows}</div>`:''}<div class="btnrow"><button type="button" id="centerFeature" class="action">◎ Recentrer</button><button type="button" id="copyFeature" class="action ghost">⧉ Copier les coordonnées</button></div><p class="fieldNote">Position indicative : ${center[0].toFixed(5)}°, ${center[1].toFixed(5)}°</p><div class="warning">Données SIA du ${DATE_SIA}. Carte de consultation, non destinée à la navigation aérienne. Vérifier les publications officielles et NOTAM en vigueur.</div>`;
showPanel('detail',isSector?'Fiche secteur':'Fiche aéronautique',`${kind}${p.code?' · '+p.code:''}`,html);$('centerFeature').onclick=()=>{zoomFeature(f);closePanel()};$('copyFeature').onclick=()=>copyText(`${center[0].toFixed(6)}, ${center[1].toFixed(6)}`);}
async function copyText(s){try{await navigator.clipboard.writeText(s);inform('Coordonnées copiées')}catch{inform('Copie indisponible sur ce navigateur')}}
map.on('click',e=>{closePanel();wherePanel(e.latlng)});
function layerPanel(){const html=`<div class="sheetSection"><div class="slabel">Afficher sur la carte</div><div class="layerlist">${ORDER.map(key=>{const cfg=CONFIG[key];return `<button type="button" class="layerbtn ${cfg.visible?'ison':''}" data-toggle-layer="${key}" aria-pressed="${cfg.visible}"><i class="layercolor" style="--layercolor:${cfg.color}"></i><span><span class="lname">${cfg.name}</span><span class="count">${groups[key].length.toLocaleString('fr-FR')} objets</span></span><span class="check">${cfg.visible?'✓':'+'}</span></button>`}).join('')}</div></div><div class="sheetSection"><div class="slabel">Types de secteurs</div><div class="chips" id="typeChips">${['ALL','CTR','TMA','R','D','P','Autres'].map(t=>`<button type="button" data-sector-type="${t}" class="chip ${t===typeFilter?'chosen':''}">${t==='ALL'?'Tous':t}</button>`).join('')}</div><p class="subtle">Filtre valable pour les secteurs affichés et les zones identifiées au toucher.</p></div><div class="sheetSection"><div class="slabel">Données</div><p class="subtle">Bibliothèque SIA du ${DATE_SIA} · ${features.length.toLocaleString('fr-FR')} objets.<br>Tu peux remplacer le fichier <b>sia.geojson</b> sur GitHub ou importer ponctuellement un autre GeoJSON depuis ton téléphone.</p><div class="btnrow"><button type="button" class="action ghost" id="importBtn">↑ Importer un GeoJSON</button><button type="button" class="action ghost" id="franceBtn">⌖ Vue France</button></div></div>`;
showPanel('layers','Couches SIA','Choisis les objets à afficher',html);
document.querySelectorAll('[data-toggle-layer]').forEach(btn=>btn.onclick=()=>{CONFIG[btn.dataset.toggleLayer].visible=!CONFIG[btn.dataset.toggleLayer].visible;$('sectorsBtn').setAttribute('aria-pressed',CONFIG.airspaces.visible);scheduleRender();layerPanel()});
document.querySelectorAll('[data-sector-type]').forEach(btn=>btn.onclick=()=>{typeFilter=btn.dataset.sectorType;scheduleRender();layerPanel()});
$('importBtn').onclick=()=>$('importFile').click();$('franceBtn').onclick=()=>{map.setView([46.5,2.2],6);closePanel()};}
function basePanel(){const html=`<div class="slabel">Choisir un fond de carte</div><div class="resultList">${Object.entries(tiles).map(([k,v])=>`<button type="button" data-base="${k}" class="resultItem"><span class="resultSwatch" style="--swatch:${baseKey===k?'#1b9d6a':'#c4d2e3'}"></span><span><span class="resultTitle">${esc(v.name)} ${baseKey===k?'✓':''}</span><span class="resultMeta">${k==='ocean'?'Contraste et ambiance sous-marine':k==='clair'?'Épuré, idéal pour les secteurs':k==='satellite'?'Imagerie aérienne':k==='ign'?'Fond cartographique français':'Carte générale'}</span></span><span class="arrow">›</span></button>`).join('')}</div><p class="fieldNote">Si des carrés ne s'affichent pas, le fond essaie automatiquement une autre source. Tu peux aussi recharger les tuiles.</p><div class="btnrow"><button type="button" class="action ghost" id="reloadMapTiles">↻ Recharger les tuiles</button></div>`;showPanel('base','Fond de carte','Choisir un affichage',html);document.querySelectorAll('[data-base]').forEach(b=>b.onclick=()=>{setBase(b.dataset.base);closePanel()});$('reloadMapTiles').onclick=()=>{const current=baseKey;setBase(current);fixMobileTiles();closePanel();inform('Tuiles rechargées',1800)};}
$('layersBtn').addEventListener('click',layerPanel);$('baseBtn').addEventListener('click',basePanel);$('sectorsBtn').addEventListener('click',()=>{CONFIG.airspaces.visible=!CONFIG.airspaces.visible;$('sectorsBtn').setAttribute('aria-pressed',CONFIG.airspaces.visible);$('sectorsBtn').classList.toggle('active',CONFIG.airspaces.visible);scheduleRender();inform(CONFIG.airspaces.visible?'Secteurs affichés':'Secteurs masqués',1700)});
$('locateBtn').addEventListener('click',()=>{if(!navigator.geolocation){inform('Géolocalisation non disponible');return}inform('Localisation en cours…');navigator.geolocation.getCurrentPosition(pos=>{const ll=[pos.coords.latitude,pos.coords.longitude];if(curPos)map.removeLayer(curPos);if(curPosCircle)map.removeLayer(curPosCircle);curPosCircle=L.circle(ll,{radius:Math.max(20,pos.coords.accuracy||20),color:'#2ddcc9',weight:1,fillColor:'#4fe4d4',fillOpacity:.08,interactive:false}).addTo(map);curPos=L.marker(ll,{icon:L.divIcon({className:'user-pin',html:'<div class="currentPos"></div>',iconSize:[17,17],iconAnchor:[8.5,8.5]})}).addTo(map);map.setView(ll,12);inform('Position affichée',1800);},err=>inform(err.code===1?'Accès à la position refusé':'Position indisponible, vérifie le GPS',4000),{enableHighAccuracy:true,timeout:12000,maximumAge:15000})});
function searchMatchRank(f,q){const p=f.properties||{};const name=norm([p.label,p.name,p.code,p.type].join(' '));const code=norm(p.code||'');let score=100;if(code===q||name===q)score=0;else if(code.startsWith(q))score=1;else if(name.startsWith(q))score=2;else if(name.includes(q))score=5;else score=12;return score+ (p.layer==='airspaces'?0:p.layer==='aerodromes'?.4:1);}
function searchResults(){const q=norm($('searchInput').value);$('clearInput').classList.toggle('shown',!!q);if(!dataReady){showPanel('search','Recherche','Données en cours de chargement','<p class="subtle"><span class="busySpinner"></span> Chargement en cours…</p>');return}const matches=[];if(q){const tokens=q.split(/\s+/).filter(Boolean);for(let i=0;i<features.length;i++){const f=features[i];if(searchFilter==='airspaces'&&f.properties.layer!=='airspaces')continue;if(searchFilter==='aerodromes'&&f.properties.layer!=='aerodromes')continue;if(searchFilter==='navigation'&&!['radionav','navfix','approach'].includes(f.properties.layer))continue;if(searchFilter==='other'&&!['heliports','routes','runways'].includes(f.properties.layer))continue;const str=searchIndex[i];if(tokens.every(t=>str.includes(t)))matches.push(f);}}
if(matches.length>80){matches.sort((a,b)=>searchMatchRank(a,q)-searchMatchRank(b,q));}else matches.sort((a,b)=>searchMatchRank(a,q)-searchMatchRank(b,q));
const show=matches.slice(0,45);const filterHtml=['all','airspaces','aerodromes','navigation','other'].map((v,i)=>`<button type="button" data-search-filter="${v}" class="chip ${v===searchFilter?'chosen':''}">${['Tout','Secteurs','Aérodromes','Navigation','Autres'][i]}</button>`).join('');const list=q?`<div class="resultList">${show.map(resultHtml).join('')||'<p class="subtle">Aucun résultat. Essaie un code, un nom ou une fréquence.</p>'}</div>`:'<p class="subtle">Cherche un nom de secteur (NICE, PYRÉNÉES), un code (LFR162, LFBO), une fréquence (125.030) ou une balise. La recherche couvre les objets visibles ou masqués.</p>';
const html=`<div class="chips" id="searchChips">${filterHtml}</div><div class="slabel">${q?matches.length.toLocaleString('fr-FR')+' résultat'+(matches.length===1?'':'s')+' · '+show.length+' affichés':'Recherche rapide'}</div>${list}`;showPanel('search','Recherche SIA',q?`« ${$('searchInput').value} »`:'Codes, noms et fréquences',html);document.querySelectorAll('[data-search-filter]').forEach(btn=>btn.onclick=()=>{searchFilter=btn.dataset.searchFilter;searchResults()});linkResults();}
$('searchInput').addEventListener('focus',searchResults);$('searchInput').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(searchResults,90)});$('clearInput').addEventListener('click',()=>{$('searchInput').value='';searchResults();$('searchInput').focus()});
$('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;status('Lecture SIA…');try{const j=JSON.parse(await file.text());loadFeatures(j);inform(`Bibliothèque importée : ${features.length.toLocaleString('fr-FR')} objets`,3900);closePanel()}catch(e){inform('Import impossible : '+e.message,6000)}e.target.value=''});
function loadFeatures(data){if(!data||data.type!=='FeatureCollection'||!Array.isArray(data.features))throw Error('GeoJSON FeatureCollection attendu');features=data.features.filter(f=>f?.type==='Feature'&&f.geometry&&CONFIG[f.properties?.layer]);featureMap.clear();searchIndex=[];for(const key of ORDER)groups[key]=[];for(let i=0;i<features.length;i++){const f=features[i],p=f.properties||{};f._bbox=(Array.isArray(p.bbox)&&p.bbox.length===4)?p.bbox:boundsGeometry(f.geometry);groups[p.layer].push(f);featureMap.set(objId(f),f);searchIndex.push(norm([p.label,p.code,p.name,p.type,p.frequency,p.service,p.frequency_details?.map(d=>[d.frequency,d.transmission,d.service_type,d.callsign].join(' ')).join(' '),p.origin,p.end,p.station,p.remarks,p.manager].filter(Boolean).join(' ')));}dataReady=true;status(features.length.toLocaleString('fr-FR')+' éléments · '+DATE_SIA,true);$('welcome').textContent='Touchez la carte pour voir les zones';selected=null;highlightGroup.clearLayers();scheduleRender();if(openPanel==='layers')layerPanel();if(openPanel==='search')searchResults()}
async function fetchLibrary(){status('Chargement SIA…');try{let geo;try{const response=await fetch('./sia-manifest.json',{cache:'no-cache'});if(!response.ok)throw Error('Liste SIA absente');const manifest=await response.json();const arrays=await Promise.all(manifest.chunks.map(async file=>{const r=await fetch('./'+file,{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status+' '+file);return (await r.json()).features}));geo={type:'FeatureCollection',features:arrays.flat()}}catch(e){const response=await fetch(SIA_FILE,{cache:'no-cache'});if(!response.ok)throw e;geo=await response.json()}loadFeatures(geo);}catch(e){status('Données à importer');$('welcome').textContent='Importer le fichier SIA pour commencer';inform('Données non trouvées. Importez le GeoJSON via Couches.',9000);console.warn('Chargement SIA impossible',e)}}
fetchLibrary();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{}));}
})();
